version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: telefleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-telefleet}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetadmin} -d ${POSTGRES_DB:-telefleet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telefleet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2000 MB (2 GB) Telegram Video Yükleme Limitini Destekleyen Resmi Yerel Bot API Sunucusu
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telefleet-local-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - shared_media:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

  # Sıfır API Maliyetli Lokal LLM Sunucusu (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: telefleet-ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

  # Lokal Python AI Kesit & Rusça Altyazı Fabrikası
  autoclip-worker:
    build:
      context: ./worker-python
      dockerfile: Dockerfile
    container_name: telefleet-autoclip-worker
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://fleetadmin:supersecretpassword@postgres:5432/telefleet?sslmode=disable}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      FFMPEG_USE_NVENC: ${FFMPEG_USE_NVENC:-true}
      MEDIA_ROOT: /var/lib/telegram-bot-api/media
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
    volumes:
      - shared_media:/var/lib/telegram-bot-api
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  # Go Çoklu Kanal Master'ı & Web Player Sunucusu
  fleet-master-go:
    build:
      context: .
      dockerfile: ./master-go/Dockerfile
    container_name: telefleet-master-go
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://fleetadmin:supersecretpassword@postgres:5432/telefleet?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-TurDiziMasterBot}
      LOCAL_BOT_API_URL: ${LOCAL_BOT_API_URL:-http://telegram-bot-api:8081}
      WEB_SERVER_PORT: ${WEB_SERVER_PORT:-8080}
      WEB_PLAYER_URL: ${WEB_PLAYER_URL:-http://localhost:8080/watch}
      VIP_PRICE_STARS: ${VIP_PRICE_STARS:-50}
      VIP_DURATION_DAYS: ${VIP_DURATION_DAYS:-30}
      REQUIRED_CHANNELS: ${REQUIRED_CHANNELS:-@TurDizi_AnaHub,@Zimorodok_Official_RU}
    volumes:
      - shared_media:/var/lib/telegram-bot-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started

volumes:
  pgdata:
  ollama_models:
  shared_media:

